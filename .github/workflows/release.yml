name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# 每个平台独立打包，全部验证成功后才公开同一个 Release。
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            name: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            name: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            name: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            name: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PIP_NO_CACHE_DIR: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf llvm-dev libasound2-dev libudev-dev
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: macOS LLVM
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(brew --prefix llvm@20)/lib" >> "$GITHUB_ENV"
      - name: Install CPU runtime (Windows and Linux)
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Intel Mac runtime
        if: matrix.name == 'macos-x64'
        run: python -m pip install torch==2.2.2 torchaudio==2.2.2 torchvision==0.17.2
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest pytest-asyncio
          python -m pip install -r backend/requirements.txt
          python -m pip install --no-deps chatterbox-tts hume-tada
      - name: Install Apple Silicon runtime
        if: matrix.name == 'macos-arm64'
        run: |
          python -m pip install -r backend/requirements-mlx.txt
          python -m pip install --no-deps mlx-lm==0.31.1 mlx-audio==0.4.1
      - name: Verify app and preservation logic
        run: |
          bun install --frozen-lockfile
          bun run --cwd app typecheck
          bun test scripts/instruct-presets.test.ts
          python -m pytest backend/tests/test_revisions.py backend/tests/test_voice_preview.py -q
      - name: Freeze both sidecars
        shell: bash
        run: |
          python backend/build_binary.py
          python backend/build_binary.py --shim
          python scripts/stage-sidecars.py '${{ matrix.target }}'
      - name: Smoke test frozen backend
        run: python scripts/smoke-frozen-server.py
      - name: Build installer
        working-directory: tauri
        shell: bash
        env:
          # 无证书时明确生成未公证包，不借用上游签名或自动更新密钥。
          APPLE_SIGNING_IDENTITY: '-'
          NO_STRIP: 'true'
        run: bun run tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - name: Collect installer and checksum
        run: python scripts/collect-release.py '${{ matrix.name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('tauri/src-tauri/tauri.conf.json'))['version'])")
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Tag and app version differ'; exit 1
          fi
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "VoiceBoxPlus $TAG" --notes-file docs/release-notes.md
